services:
  mysql:
    image: mysql:8.0
    container_name: lifecycle-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: lifecycle
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./lifecycle/lifecycle-backend
      dockerfile: Dockerfile
    container_name: lifecycle-backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/lifecycle?createDatabaseIfNotExist=true&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
      DB_USER: root
      DB_PASSWORD: rootpassword
      JWT_SECRET: supersecretproductionjwtkeythatis32charslong!
      CORS_ORIGIN: "*"
      PORT: 8080
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./lifecycle/lifecycle-frontend
      dockerfile: Dockerfile
    container_name: lifecycle-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  mysql_data:
