server.port=${PORT:8080}
# Default: in-memory H2 so the app runs with zero setup. Use `-Dspring.profiles.active=mysql` for MySQL.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:lifecycle;DB_CLOSE_DELAY=-1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.h2.console.enabled=${SPRING_H2_CONSOLE_ENABLED:true}
app.jwt.secret=${JWT_SECRET:change-this-secret-key-to-at-least-32-characters-long}
app.cors.origin=${CORS_ORIGIN:*}
app.seed=${APP_SEED:true}
# Configurable depreciation rules (annual rate by category)
app.depreciation.default=0.12
app.depreciation.electronics=0.20
app.depreciation.appliance=0.12
app.depreciation.vehicle=0.15
app.depreciation.furniture=0.08
