services:
  # Backend Web Service
  - type: web
    name: lifecycle-backend
    env: docker
    dockerContext: .
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"
      - key: SPRING_PROFILES_ACTIVE
        value: default
      - key: PORT
        value: 10000

  # Frontend Static Site
  - type: web
    name: lifecycle-frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    plan: free
    region: oregon
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: lifecycle-backend
          property: host
